[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theaterdb"
version = "0.1.0"
description = "German Theatre Play Database"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"sqlmodel>=0.0.24",
	"sqlalchemy>=2.0.51",
	"streamlit>=1.66.1",
	"authlib>=1.7.2",
	"psycopg[binary]>=3.3.4",
	"python-dotenv>=1.2.1",
	"procrastinate>=3.10,<4",
	"alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "prek>=0.4.4",
    "ruff>=0.15.18",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "jsonschema>=4.26.0",
    "rfc3339-validator>=0.1.4",
    "types-pyyaml>=6.0.12.20261111",
    "types-jsonschema>=4.26.0.20261006",
    "types-tqdm>=4.70.0.20261106",
]
ingest=[
	"babel>=2.17",
	"tqdm>=4.67.3",
	"aiohttp>=3.14.1",
	"selectolax>=0.4.10",
	"pyyaml>=6.0.3",
	"markdownify>=1.2.3",
]

[tool.alembic]
script_location = "%(here)s/backend/migrations"
prepend_sys_path = ["%(here)s"]

[tool.ruff]
fix = true
line-length = 120
target-version = "py314"

[tool.ruff.lint]
extend-select = [
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # mccabe
  "D",    # pydocstyle
  "FURB", # refurb
  "I",    # isort
  "N",    # pep8-naming
  "PERF", # Perflint
  "PL",   # pylint
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
  "W",    # pycodestyle (warning)
]
ignore = [
  "undocumented-public-module",
  "undocumented-public-package",
  "PLR",    # pylint refactor
]
preview = true

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*" = ["D", "trailing-whitespace", "line-too-long"]

"tests/*" = [
  "import-private-name",
  "assert",
  "undocumented-public-function",
  "missing-type-function-argument",
  "missing-return-type-private-function",
  "missing-return-type-undocumented-public-function"
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["backend*", "frontend*", "old_do_not_use*"]

[tool.setuptools.package-data]
"backend.ingestion" = ["configs/*.yaml", "staging.schema.json"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
]
