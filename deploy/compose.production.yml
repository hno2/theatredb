services:
  app:
    image: ${THEATREDB_IMAGE:?Set THEATREDB_IMAGE to the release image digest}
    environment:
      THEATERDB_ENV: production
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  crawl-worker:
    image: ${THEATREDB_IMAGE:?Set THEATREDB_IMAGE to the release image digest}
