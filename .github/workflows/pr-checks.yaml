name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and PR history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install locked dependencies
        id: dependencies
        run: uv sync --locked --all-groups

      - name: Run pre-commit hooks on PR changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --locked --all-groups prek run --from-ref "$PR_BASE_SHA" --to-ref "$PR_HEAD_SHA"

      - name: Run all tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked --all-groups pytest
