name: Deploy production
run-name: ${{ inputs.publish_only && 'Publish production image' || 'Deploy production' }} (${{ github.sha }})

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish image without deploying (first-time GHCR setup)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.14"

      - run: uv sync --locked --all-groups
      - run: uv run --locked --all-groups pytest

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build and publish image
        id: publish
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/hno2/theatredb"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "$image:$GITHUB_SHA" \
            --build-arg "THEATERDB_COMMIT=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --metadata-file "$RUNNER_TEMP/build.json" .
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/build.json")
          echo "image=$image@$digest" | tee -a "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.publish_only)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://theater.simonklug.de
    steps:
      - name: Deploy exact image over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ vars.SSH_TARGET }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          : "${SSH_KEY:?Set production secret SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?Set production variable SSH_KNOWN_HOSTS}"
          : "${SSH_TARGET:?Set production variable SSH_TARGET}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          status=0
          ssh -T -p "$SSH_PORT" -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -- "$SSH_TARGET" "$IMAGE" || status=$?
          if [ "$status" -eq 127 ]; then
            echo "SSH command not found. Check the production deploy key's forced command; see specs/development.md." >&2
          fi
          exit "$status"
